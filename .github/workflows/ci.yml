name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish
        run: |
          dotnet publish src/TapQueue.Server -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o out/server-linux-x64
          dotnet publish src/TapQueue.Admin -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o out/server-linux-x64
          dotnet publish src/TapQueue.Client.Windows -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/client-win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: tapqueue-server-linux-x64
          path: out/server-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: tapqueue-client-win-x64
          path: out/client-win-x64
