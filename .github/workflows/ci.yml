name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tapqueue-${{ github.sha }}
          path: dist/

  # The Windows installer needs Inno Setup, so it's built on Windows.
  client-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build installer
        shell: pwsh
        run: ./scripts/package-client-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: tapqueue-client-installer-${{ github.sha }}
          path: dist/
