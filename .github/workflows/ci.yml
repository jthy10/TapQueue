name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tapqueue-${{ github.sha }}
          path: dist/

  # The Windows installer needs Inno Setup, so it's built on Windows.
  client-installer:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build installer
        shell: pwsh
        run: ./scripts/package-client-installer.ps1

      - name: Smoke test the Windows service (built on Windows)
        shell: pwsh
        run: ./scripts/smoke-test-windows-service.ps1 out/client/TapQueueClient.exe

      # scripts/package.sh builds the Windows client on Linux too; that's the zip published to servers.
      - uses: actions/download-artifact@v4
        with:
          name: tapqueue-${{ github.sha }}
          path: linux-built

      - name: Smoke test the Windows service (built on Linux)
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem linux-built/TapQueue_client_*_win-x64.zip).FullName linux-built/client
          ./scripts/smoke-test-windows-service.ps1 linux-built/client/TapQueueClient.exe

      # The Linux-built exe differs from the one built here, so it can stand in for a new build.
      - name: Update the Windows service to a pushed build
        shell: pwsh
        run: ./scripts/test-windows-service-update.ps1 -From out/client/TapQueueClient.exe -To linux-built/client/TapQueueClient.exe

      - uses: actions/upload-artifact@v4
        with:
          name: tapqueue-client-installer-${{ github.sha }}
          path: dist/

  # CUPS adding and printing to a queue over ipps:// with the server's self-signed certificate.
  cups-ipps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install CUPS
        run: sudo apt-get update && sudo apt-get install -y cups cups-client cups-ipp-utils

      - name: Build
        run: dotnet build -c Release src/TapQueue.Server && dotnet build -c Release src/TapQueue.Admin

      - name: Print over ipps://
        run: sudo scripts/test-cups-ipps.sh

  # Windows' IPP driver printing over https:// to the server's self-signed certificate, which the
  # TapQueue service trusts on first use and adds to the machine's trusted roots.
  windows-ipps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: |
          dotnet build -c Release src/TapQueue.Server
          dotnet build -c Release src/TapQueue.Admin
          dotnet publish src/TapQueue.Client.Windows -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/ipps-client

      - name: Print over https://
        shell: pwsh
        run: ./scripts/test-windows-ipps.ps1 out/ipps-client/TapQueueClient.exe

  # install.ps1 as someone would run it on a PC: Windows PowerShell 5.1, the newest GitHub release.
  install-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install with install.ps1
        shell: powershell
        env:
          TAPQUEUE_SERVER: http://127.0.0.1:9
        run: |
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          $service = Get-Service TapQueue
          if ($service.Status -ne "Running") { throw "The TapQueue service is $($service.Status)." }
          if (-not (Select-String -Quiet -Path "$env:ProgramData\TapQueue\client.toml" -Pattern '127\.0\.0\.1:9')) { throw "client.toml doesn't have the server." }

      - name: Run it again (upgrade or repair)
        shell: powershell
        run: Get-Content -Raw ./install.ps1 | Invoke-Expression
