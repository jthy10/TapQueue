name: release

# Server and station:  push a tag server-vX.Y.Z  (matching <Version> in Directory.Build.props)
# Windows client:      push a tag client-vX.Y.Z  (matching <TapQueueClientVersion>)
# Each publishes a GitHub release with notes from its changelog. See docs/releasing.md.
on:
  push:
    tags: ['server-v*', 'client-v*']

permissions:
  contents: write

jobs:
  server:
    if: startsWith(github.ref_name, 'server-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "server-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match <Version>$version</Version> in Directory.Build.props"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh CHANGELOG.md "$VERSION" > notes.md

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Package
        run: scripts/package.sh server

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "TapQueue server and station $VERSION" --notes-file notes.md dist/*

  client:
    if: startsWith(github.ref_name, 'client-v')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's:.*<TapQueueClientVersion>\(.*\)</TapQueueClientVersion>.*:\1:p' Directory.Build.props)
          if [ "client-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match <TapQueueClientVersion>$version</TapQueueClientVersion> in Directory.Build.props"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG-client.md
        run: scripts/release-notes.sh CHANGELOG-client.md "$VERSION" > notes.md

      - name: Package
        shell: pwsh
        run: ./scripts/package-client-installer.ps1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "TapQueue Windows client $VERSION" --notes-file notes.md dist/*
