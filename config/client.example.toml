# TapQueue client configuration, for the whole PC. The installer writes it; only admins can change it.
#   Windows: C:\ProgramData\TapQueue\client.toml
#   Linux:   /etc/tapqueue/client.toml

# The TapQueue server. https:// on port 8632 encrypts everything, printing included;
# http://tapqueue-server:8631 still works with servers that allow plain HTTP.
server_url = "https://tapqueue-server:8632"

# For a server with a self-signed certificate: its SHA-256 fingerprint (`tapqueue-admin server`
# shows it). Leave empty to trust the certificate the TapQueue service sees the first time it
# connects. Not needed for a certificate from a CA the PC already trusts.
server_cert_fingerprint = ""

# The server's enrollment code, if it asks new PCs for one (an admin gets it with
# `tapqueue-admin server enrollment-code new`). Only needed until this PC has registered.
enrollment_code = ""

# Your TapQueue username. Leave empty to use the name you sign in to the PC with.
username = ""

# Your client token from `tapqueue-admin users add <username>`.
# Not needed when the server is running with auth.mode = "dev".
token = ""

# Let the TapQueue service add the server's print queue(s) to this PC as printers.
install_printers = true
