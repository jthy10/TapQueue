# TapQueue client configuration, for the whole PC. The installer writes it; only admins can change it.
#   Windows: C:\ProgramData\TapQueue\client.toml
#   Linux:   /etc/tapqueue/client.toml

# The TapQueue server.
server_url = "http://tapqueue-server:8631"

# Your TapQueue username. Leave empty to use the name you sign in to the PC with.
username = ""

# Your client token from `tapqueue-admin users add <username>`.
# Not needed when the server is running with auth.mode = "dev".
token = ""

# Let the TapQueue service add the server's print queue(s) to this PC as printers.
install_printers = true
